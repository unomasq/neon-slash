<!doctype html><meta charset="utf-8"><title>...</title>
<body><pre id="o">running</pre>
<script type="module">
// Тест воркера MoveNet. ?delegate=GPU|CPU & prep=canvas|bitmap|pixels & w=480&h=360 & secs=8
// Без камеры: только init (title='OK ...'). С ?cam=1: поток VideoFrame с камеры (fake-камера Chrome),
// через secs секунд title='BD {json}' (средние read/prep/infer/post/lat/fps) и console.log('BD ...')
const q = new URLSearchParams(location.search);
const o = document.getElementById('o');
const done = (t) => { document.title = t; o.textContent = t; console.log(t); };
let backend = '?';
const w = new Worker('/src/tracking/movenet.worker.ts', { type: 'module' });
const acc = { n: 0, read: 0, prep: 0, infer: 0, post: 0, lat: 0, ms: 0, first: 0, last: 0, luma: 0, low: false };
let measuring = false;
w.onmessage = (e) => { const m = e.data;
  if (m.type === 'backend') backend = m.name;
  else if (m.type === 'ready') {
    if (q.get('cam')) startCam().catch((e) => done('ERR cam: ' + (e && (e.name + ' ' + e.message))));
    else done('OK ' + (m.backend ?? backend) + ' ' + m.delegate + ' SAB=' + (typeof SharedArrayBuffer !== 'undefined'));
  }
  else if (m.type === 'result') {
    const now = performance.now();
    if (!measuring && ++acc.skip > 10) { measuring = true; }
    if (measuring && m.bd) {
      if (!acc.n) acc.first = now; acc.last = now;
      acc.n++; acc.read += m.bd.read; acc.prep += m.bd.prep; acc.infer += m.bd.infer; acc.post += m.bd.post; acc.lat += m.lat; acc.ms += m.ms;
      acc.luma = m.luma; acc.low = m.low;
    }
  }
  else if (m.type === 'error') done('ERR[' + backend + ']: ' + m.message); };
acc.skip = 0;
w.onerror = (e) => done('ERR: ' + (e.message || 'worker error'));
setTimeout(() => { if (document.title === '...') done('ERR[' + backend + ']: timeout 60s'); }, 60000);

async function startCam() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30, min: 24 } }, audio: false });
  const track = stream.getVideoTracks()[0];
  const s = track.getSettings();
  const { readable } = new MediaStreamTrackProcessor({ track, maxBufferSize: 1 });
  w.postMessage({ type: 'stream', readable }, [readable]);
  setTimeout(() => {
    const n = acc.n || 1, f = (v) => +(v / n).toFixed(1);
    const fps = acc.n > 1 ? +(1000 * (acc.n - 1) / (acc.last - acc.first)).toFixed(1) : 0;
    done('BD ' + JSON.stringify({ prep: q.get('prep') || 'config', size: (q.get('w') || 'cfg') + 'x' + (q.get('h') || ''), cam: `${s.width}x${s.height}@${s.frameRate}`,
      n: acc.n, fps, read: f(acc.read), prepMs: f(acc.prep), infer: f(acc.infer), post: f(acc.post), cycle: f(acc.ms), lat: f(acc.lat), luma: Math.round(acc.luma), low: acc.low, backend }));
  }, (+q.get('secs') || 8) * 1000 + 3000);
}
const delegate = q.get('delegate') === 'GPU' ? 'GPU' : 'CPU';
const init = { type: 'init', delegate, wasmUrl: location.origin + '/tfjs-wasm/',
  modelUrl: '/models/movenet-lightning/model.json', origin: performance.timeOrigin, maxFps: 30 };
if (q.get('w')) { init.frameW = +q.get('w'); init.frameH = +q.get('h'); }
if (q.get('prep')) init.prep = q.get('prep');
if (q.get('low')) init.forceLow = true;
w.postMessage(init);
</script>
